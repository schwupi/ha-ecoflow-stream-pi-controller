                name: EV Power
              - entity: sensor.ecoflow_unified_ev_charging
                name: EV Charging
              - entity: input_boolean.ecoflow_ev_discharge_800w
                name: Enable EV Support
              - entity: input_number.ecoflow_unified_ev_threshold_w
                name: EV Detection Threshold
              - entity: input_number.ecoflow_unified_ev_discharge_power
