                name: Charge Allowed

          - type: entities
            title: EcoFlow Charge / Discharge - Calculation
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.ecoflow_unified_current_charge
                name: Current Charge
              - entity: sensor.ecoflow_unified_current_discharge
                name: Current Discharge
              - entity: sensor.ecoflow_unified_current_power
                name: Current Unified Power
              - entity: sensor.ecoflow_unified_target_power
                name: Target Unified Power
              - type: divider
              - entity: sensor.efctrl_current_charge_limit
                name: EFCTRL Charge Limit
              - entity: sensor.efctrl_current_discharge_limit
                name: EFCTRL Discharge Limit

          - type: entities
            title: EcoFlow Battery Charging - Source Now
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.ecoflow_battery_charge_power_actual
                name: Battery Charge Power Actual
              - entity: sensor.ecoflow_battery_charge_from_pv_power
                name: Charge From PV Now
              - entity: sensor.ecoflow_battery_charge_from_grid_power
                name: Charge From Grid Now
              - type: divider
              - entity: sensor.ecoflow_unified_grid_raw
                name: Grid Raw
              - entity: sensor.ecoflow_unified_grid_smoothed_value
                name: Grid Smoothed
              - entity: sensor.ecoflow_unified_pv_power
                name: PV Power

          - type: entities
            title: EcoFlow Battery Charging - Energy Counters
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.ecoflow_battery_charge_from_pv_energy
                name: Total From PV
              - entity: sensor.ecoflow_battery_charge_from_grid_energy
                name: Total From Grid
              - type: divider
              - entity: sensor.ecoflow_battery_charge_from_pv_daily
                name: Today From PV
              - entity: sensor.ecoflow_battery_charge_from_grid_daily
                name: Today From Grid
              - entity: sensor.ecoflow_battery_charge_pv_share_daily
                name: PV Share Today
              - type: divider
              - entity: sensor.ecoflow_battery_charge_from_pv_monthly
                name: Month From PV
              - entity: sensor.ecoflow_battery_charge_from_grid_monthly
                name: Month From Grid
              - entity: sensor.ecoflow_battery_charge_pv_share_monthly
                name: PV Share Month

          - type: markdown
            title: EcoFlow Unified Controller - Logic
            content: >
              **Sign convention**

              `Grid > 0 W` = grid import  
              `Grid < 0 W` = grid export / feed-in

              `Target Power > 0 W` = battery discharge  
              `Target Power < 0 W` = battery charge  
              `Target Power = 0 W` = idle / deadband

              **PI controller**

              `Error = Grid Smoothed - Target Grid`

              `P-Term = Kp * Error`

              `I-Term = stored integral value`

              `Target Power = Current Unified Power + P-Term + I-Term`

              This is an incremental controller. It starts from the current
              EcoFlow output and corrects the value every 5 seconds.

              **Anti-windup**

              The I term is limited and frozen when the EcoFlow is already at
              the charge or discharge actuator limit and the error would push
              further into the same saturated direction.

              **Charge gate**

              `allowed` = charging allowed  
              `blocked` = charging blocked, discharging remains allowed

              Enable condition:

              `PV > Charge Enable PV` and `Grid Smoothed < -Charge Enable Export`
              for 60 seconds.

              Disable condition:

              `PV < Charge Disable PV` for 60 seconds.

              **Safety**

              Controller disabled:

              `Charge Power = 0 W`  
              `Discharge Power = 0 W`  
              `Integral = 0 W`

              Charge gate blocked:

              `Charge Power = 0 W`  
              `Integral = 0 W`  
              Discharge is not automatically stopped.

              **EV logic**

              EV not charging: normal PI control.  
              EV charging and support disabled: EcoFlow forced to 0 W.  
              EV charging and support enabled: EcoFlow discharges at configured
              EV support power.

