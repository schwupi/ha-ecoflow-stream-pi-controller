  - title: Configuration
    path: ecoflow-configuration
    icon: mdi:cog
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: EcoFlow Unified Controller - Main Parameters
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_boolean.ecoflow_unified_controller_enabled
                name: Controller Enabled
              - type: divider
              - entity: input_number.ecoflow_unified_target_grid
                name: Target Grid
              - entity: input_number.ecoflow_unified_deadband
                name: Deadband
              - type: divider
              - entity: input_number.ecoflow_unified_kp
                name: Kp
              - entity: input_number.ecoflow_unified_ki
                name: Ki
              - entity: input_number.ecoflow_unified_integral
                name: Integral Memory
              - entity: input_number.ecoflow_unified_integral_limit
                name: Integral Limit
              - entity: input_button.ecoflow_unified_integral_reset
                name: Reset Integral

          - type: markdown
            title: Recommended Conservative Beta Values
            content: >
              **Recommended starting values**

              `Kp = 0.20`  
              `Ki = 0.002`  
              `Target Grid = -20 W`  
              `Deadband = 50 W`  
              `Integral Limit = 120 W`  
              `Control interval = 5 s`

              Reset the integral memory after changing controller behavior.

              Start conservative. The goal is stable behavior first, not perfect
              zero-grid tracking immediately.

          - type: entities
            title: EcoFlow Unified Controller - Limits
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.ecoflow_unified_max_discharge
                name: Max Discharge
              - entity: input_number.ecoflow_unified_max_charge
                name: Max Charge
              - entity: input_number.ecoflow_unified_discharge_step_w
                name: Discharge Step
              - entity: input_number.ecoflow_unified_charge_step_w
                name: Charge Step
              - entity: input_number.ecoflow_unified_min_discharge_soc
                name: Min Discharge SOC

          - type: entities
            title: EcoFlow Charge Gate - PV Charging Permission
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.ecoflow_unified_charge_gate
                name: Charge Gate Status
              - entity: input_boolean.ecoflow_unified_charge_allowed
                name: Charge Allowed
              - type: divider
              - entity: input_number.ecoflow_unified_charge_enable_pv_w
                name: Charge Enable PV
              - entity: input_number.ecoflow_unified_charge_disable_pv_w
                name: Charge Disable PV
              - entity: input_number.ecoflow_unified_charge_enable_export_w
                name: Charge Enable Export
              - type: divider
              - entity: sensor.ecoflow_unified_pv_power
                name: PV Power
              - entity: sensor.ecoflow_unified_grid_smoothed_value
                name: Grid Smoothed

          - type: entities
